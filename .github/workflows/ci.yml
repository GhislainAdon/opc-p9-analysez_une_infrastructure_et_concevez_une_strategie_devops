# Pipeline CI/CD d'initialisation — GlossaPro (squelette glossaflow-api)
#
# Déclenché à chaque push et merge request. Quatre étapes :
#   lint     : qualité de code (ESLint)
#   test     : tests unitaires (Jest) — le pipeline échoue si un test est rouge
#   build    : image Docker construite et archivée en artefact
#   security : scan de vulnérabilités de l'image (Trivy) — bloquant HIGH/CRITICAL
#
# Chaque étape correspond à un job du même nom dans l'onglet Actions.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: Lint (qualité de code)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package.json }
      - run: npm install
      - run: npm run lint

  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package.json }
      - run: npm install
      - run: npm test

  build:
    name: Build image Docker
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image (tag = branche-sha court)
        run: |
          TAG="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::8}"
          docker build -t glossaflow-api:"$TAG" app
          docker save glossaflow-api:"$TAG" -o image.tar
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with: { name: image, path: image.tar, retention-days: 3 }

  security:
    name: Scan sécurité (Trivy)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: image }
      - name: Scanner l'image — bloquant sur vulnérabilités HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: image.tar
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
