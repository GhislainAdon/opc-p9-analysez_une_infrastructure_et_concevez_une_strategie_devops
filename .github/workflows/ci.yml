# Pipeline CI/CD d'initialisation — GlossaPro (squelette glossaflow-api)
#
# Ce dépôt est livré sur GitLab (pipeline de référence : .gitlab-ci.yml) et
# miroité sur GitHub. Ce workflow rejoue le même enchaînement côté GitHub.
#
# Déclenché à chaque push et pull request. Cinq étapes :
#   lint     : qualité de code (ESLint)
#   test     : tests unitaires (Jest) — le pipeline échoue si un test est rouge
#   build    : image Docker construite et archivée en artefact
#   security : Trivy (vulnérabilités de l'image, bloquant HIGH/CRITICAL)
#              + gitleaks (secrets dans l'historique git, bloquant)
#   verify   : smoke test — le conteneur est réellement démarré et interrogé
#
# Chaque étape correspond à un job du même nom dans l'onglet Actions.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: Lint (qualité de code)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package.json }
      - run: npm install
      - run: npm run lint

  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package.json }
      - run: npm install
      - run: npm test

  build:
    name: Build image Docker
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image (tag = branche-sha court)
        run: |
          TAG="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::8}"
          docker build -t glossaflow-api:"$TAG" app
          docker save glossaflow-api:"$TAG" -o image.tar
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with: { name: image, path: image.tar, retention-days: 3 }

  security:
    name: Scan sécurité (Trivy)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: image }
      - name: Scanner l'image — bloquant sur vulnérabilités HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: image.tar
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

  # Recherche de secrets (mots de passe, tokens, clés) dans TOUT l'historique
  # git : un secret supprimé reste lisible dans les commits précédents.
  # fetch-depth: 0 récupère l'historique complet, sinon le scan ne voit rien.
  gitleaks:
    name: Scan secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Détecter les secrets — bloquant
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
            detect --source . --config .gitleaks.toml --no-banner --redact \
            --report-format json --report-path reports/gitleaks.json --exit-code 1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: rapport-gitleaks, path: reports/gitleaks.json, retention-days: 3 }

  # Le build peut réussir alors que l'application ne démarre pas : on lance
  # donc l'image construite et on appelle ses deux routes avant de la déclarer
  # déployable.
  verify:
    name: Smoke test (démarrage réel)
    runs-on: ubuntu-latest
    needs: [security]
    steps:
      - uses: actions/download-artifact@v4
        with: { name: image }
      - name: Démarrer le conteneur et interroger l'API
        run: |
          TAG="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::8}"
          docker load -i image.tar
          docker run -d --name smoke -p 3000:3000 glossaflow-api:"$TAG"
          for i in $(seq 1 15); do
            curl -fs http://localhost:3000/health && break
            echo "tentative $i/15 — l'API ne répond pas encore"; sleep 2
          done
          curl -fs http://localhost:3000/health | grep '"status":"ok"'
          curl -fs -X POST http://localhost:3000/translate \
            -H "Content-Type: application/json" \
            -d '{"text":"bonjour","target":"en"}' | grep '\[en\] bonjour'
          echo "Smoke test OK — l'image démarre et répond."
      - name: Journaux du conteneur (toujours affichés)
        if: always()
        run: docker logs smoke || true
